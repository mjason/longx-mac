name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Test
        run: xcodebuild -project LongX.xcodeproj -scheme LongX -configuration Debug -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/LongX-tests" CODE_SIGN_IDENTITY=- test
