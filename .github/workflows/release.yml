name: Signed Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v0.1.0'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      LONGX_SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
      LONGX_NOTARY_PROFILE: LongX-CI
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: true
      - name: Validate version and signing secrets
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release tag'; exit 1; }
          for value in CERTIFICATE CERTIFICATE_PASSWORD LONGX_SIGNING_IDENTITY APPLE_ID TEAM_ID APPLE_PASSWORD SPARKLE_KEY; do
            [[ -n "${!value}" ]] || { echo "Missing required secret: $value"; exit 1; }
          done
          version=$(xcodebuild -project LongX.xcodeproj -scheme LongX -configuration Release -showBuildSettings | awk '/ MARKETING_VERSION = / {if (!v) v=$3} END {print v}')
          [[ "$RELEASE_TAG" == "v$version" ]] || { echo 'Tag and MARKETING_VERSION must match'; exit 1; }
      - name: Import signing identity and notarization credentials
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/LongX-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/LongX-signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/LongX-signing.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          xcrun notarytool store-credentials "$LONGX_NOTARY_PROFILE" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APPLE_PASSWORD"
          rm "$RUNNER_TEMP/LongX-signing.p12"
      - name: Test
        run: xcodebuild -project LongX.xcodeproj -scheme LongX -configuration Debug -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/LongX-tests" CODE_SIGN_IDENTITY=- test
      - name: Build, sign, notarize and package
        run: ./scripts/release.sh
      - name: Generate signed update feed
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/Sparkle-tools"
          mkdir -p "$tools"
          curl -fsSL https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz -o "$tools/release.tar.xz"
          tar -xf "$tools/release.tar.xz" -C "$tools"
          umask 077
          printf '%s' "$SPARKLE_KEY" > "$RUNNER_TEMP/Sparkle-private-key"
          "$tools/bin/generate_appcast" --ed-key-file "$RUNNER_TEMP/Sparkle-private-key" --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/" --maximum-deltas 0 dist
          rm "$RUNNER_TEMP/Sparkle-private-key"
          test -s dist/appcast.xml
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip dist/*.sha256 dist/appcast.xml* --clobber
            gh release edit "$RELEASE_TAG" --draft=false --latest
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 dist/appcast.xml* --verify-tag --title "LongX $RELEASE_TAG" --generate-notes --latest
          fi
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/LongX-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/LongX-signing.p12" "$RUNNER_TEMP/Sparkle-private-key"
